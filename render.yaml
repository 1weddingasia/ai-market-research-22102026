services:
  - type: web
    name: insight-market-research-backend
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUTF8
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SEPAY_API_TOKEN
        sync: false
      - key: R2_ENDPOINT
        value: https://d06760425346907098bfbc09e6cb3e4a.r2.cloudflarestorage.com
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: personas-vietnam
      - key: R2_FILE_KEY
        value: personas_vn_1m.parquet
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: hi@1booking.asia
      - key: FRONTEND_URL
        value: https://insight.1booking.asia
      - key: CORS_ORIGINS
        value: https://insight.1booking.asia,http://localhost:3000
