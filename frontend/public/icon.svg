<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Radiant Imperial Gold Gradient Background -->
    <linearGradient id="goldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE68A" />
      <stop offset="25%" stopColor="#FBBF24" />
      <stop offset="70%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#B45309" />
    </linearGradient>

    <!-- Deep Navy & White Contrast Filters -->
    <linearGradient id="navyFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#1E293B" />
    </linearGradient>

    <filter id="goldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#78350F" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Golden Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#goldBg)" stroke="#FEF3C7" stroke-width="1.5" />

  <!-- Inner Diamond Symbol in Deep Slate Navy & Crisp White (High Contrast, Bold, Ultra Legible) -->
  <g filter="url(#goldShadow)">
    <!-- Outer Faceted Diamond / Hexagon -->
    <path
      d="M32 9L51 20V44L32 55L13 44V20L32 9Z"
      fill="url(#navyFacet)"
      stroke="#FFFFFF"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- Diamond facets refraction lines in gold -->
    <path
      d="M32 9L32 55"
      stroke="#FBBF24"
      stroke-width="2"
      stroke-linecap="round"
    />
    <path
      d="M13 20L32 32L51 20"
      stroke="#FDE68A"
      stroke-width="1.8"
      stroke-linejoin="round"
    />
    <path
      d="M13 44L32 32L51 44"
      stroke="#F59E0B"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- Radiant Central Core Star in Pure White -->
    <circle cx="32" cy="32" r="4.5" fill="#FFFFFF" />
    <circle cx="32" cy="32" r="2.2" fill="#D97706" />
  </g>
</svg>
